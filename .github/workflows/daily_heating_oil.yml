name: Daily Heating Oil Price Alert

on:
schedule:
- cron: '0 8 * * *'
workflow_dispatch:

jobs:
send_email:
runs-on: ubuntu-latest

```
permissions:
  contents: write

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - run: pip install requests beautifulsoup4 matplotlib

  - name: Run script
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
    run: python heating_oil_alert.py

  - name: Commit price history
    run: |
      git config --global user.name "oil-price-bot"
      git config --global user.email "bot@github.com"
      git add heating_oil_prices.csv
      git commit -m "Update price history" || echo "No changes"
      git push
```
